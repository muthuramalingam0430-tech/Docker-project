<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
  <title id="t">Docker Compose project flow</title>
  <desc id="d">Animated flow from PuTTY to the Ubuntu server, the database container, the app container and the browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Docker Compose flow: app + database</text>

  <line x1="90" y1="70" x2="810" y2="70" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="90" y1="70" x2="90" y2="100" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="270" y1="70" x2="270" y2="100" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="450" y1="70" x2="450" y2="100" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="630" y1="70" x2="630" y2="100" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="810" y1="70" x2="810" y2="100" stroke="#cbd5e1" stroke-width="2"/>

  <line x1="160" y1="130" x2="198" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="130" x2="378" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="130" x2="558" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="130" x2="738" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="20" y="100" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2">
    <animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#f1f5f9;#f1f5f9;#bfdbfe;#bfdbfe;#f1f5f9;#f1f5f9" keyTimes="0;0;0.03;0.17;0.2;1"/>
  </rect>
  <text x="90" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">PuTTY (SSH)</text>
  <text x="90" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">log in to Ubuntu</text>

  <rect x="200" y="100" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2">
    <animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#f1f5f9;#f1f5f9;#bfdbfe;#bfdbfe;#f1f5f9;#f1f5f9" keyTimes="0;0.2;0.23;0.37;0.4;1"/>
  </rect>
  <text x="270" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Ubuntu server</text>
  <text x="270" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">docker compose up</text>

  <rect x="380" y="100" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2">
    <animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#f1f5f9;#f1f5f9;#bbf7d0;#bbf7d0;#f1f5f9;#f1f5f9" keyTimes="0;0.4;0.43;0.57;0.6;1"/>
  </rect>
  <text x="450" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">db container</text>
  <text x="450" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">PostgreSQL 16</text>

  <line x1="450" y1="160" x2="450" y2="192" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="380" y="192" width="140" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="450" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">db_data volume</text>

  <rect x="560" y="100" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2">
    <animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#f1f5f9;#f1f5f9;#bbf7d0;#bbf7d0;#f1f5f9;#f1f5f9" keyTimes="0;0.6;0.63;0.77;0.8;1"/>
  </rect>
  <text x="630" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">app container</text>
  <text x="630" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">built from Dockerfile</text>

  <rect x="740" y="100" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2">
    <animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#f1f5f9;#f1f5f9;#fde68a;#fde68a;#f1f5f9;#f1f5f9" keyTimes="0;0.8;0.83;0.95;0.98;1"/>
  </rect>
  <text x="810" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Browser</text>
  <text x="810" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">http://ip:3000</text>

  <circle r="8" fill="#f97316" stroke="#c2410c" stroke-width="2">
    <animateMotion dur="10s" repeatCount="indefinite" path="M 90,70 L 810,70" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/>
  </circle>

  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a" opacity="0">Step 1: Connect to the server with PuTTY
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0;0.03;0.17;0.2;1"/>
  </text>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a" opacity="0">Step 2: Run docker compose up -d --build
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2;0.23;0.37;0.4;1"/>
  </text>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a" opacity="0">Step 3: Database starts and passes its healthcheck
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4;0.43;0.57;0.6;1"/>
  </text>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a" opacity="0">Step 4: App starts once the database is healthy
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.63;0.77;0.8;1"/>
  </text>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a" opacity="0">Step 5: Open the app in your browser on port 3000
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8;0.83;0.95;0.98;1"/>
  </text>
</svg>
